name: RTL Verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cocotb-verilator:
    name: Cocotb regression (Verilator)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git help2man perl python3 make autoconf g++ flex bison ccache libgoogle-perftools-dev numactl perl-doc libfl2 libfl-dev zlib1g zlib1g-dev

      - name: Build supported Verilator version
        run: |
          git clone --depth 1 --branch v5.036 https://github.com/verilator/verilator.git "$RUNNER_TEMP/verilator-src"
          cd "$RUNNER_TEMP/verilator-src"
          autoconf
          ./configure
          make -j2
          sudo make install
          verilator --version
          verilator --version | grep -E '5\\.036|5\\.(0(3[7-9]|[4-9][0-9])|[1-9][0-9])'

      - name: Install Cocotb
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cocotb>=2.1,<3"

      - name: Run regression and capture proof
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          {
            echo "Commit: $GITHUB_SHA"
            echo "UTC time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "Python: $(python --version)"
            echo "Cocotb: $(python -c 'import cocotb; print(cocotb.__version__)')"
            echo "Verilator: $(verilator --version)"
            echo
            make SIM=verilator WAVES=1
          } 2>&1 | tee artifacts/regression.log

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ddr-controller-verification-${{ github.sha }}
          path: |
            artifacts/regression.log
            results.xml
            dump.vcd
            sim_build/
          if-no-files-found: warn
          retention-days: 90
